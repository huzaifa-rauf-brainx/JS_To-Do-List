<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update To-Do Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="assets/JavaScript/update-script.js" defer></script>
    <link rel="icon" href="assets/Images/favicon.png" type="image/png" />
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-warning mt-5">Update Task</h1>
            <form id="updateTaskForm" novalidate>
                <div class="mb-3">
                    <label for="taskId" class="form-label">Task ID</label>
                    <input type="number" class="form-control" id="taskId" name="taskId"
                        placeholder="Enter task ID to update" required min="1" />
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Task Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                        placeholder="Enter new name of the task" required minlength="3" />
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="" disabled selected>Select status</option>
                        <option value="Completed">Completed</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <a href="index.html" class="btn btn-outline-success">Go back</a>
                    <button type="submit" class="btn btn-warning" id="updateBtn">Update Task</button>
                </div>
                <div id="toast" class="alert d-none mt-3" role="alert"></div>
            </form>
        </div>
    </div>
</body>
</html>
