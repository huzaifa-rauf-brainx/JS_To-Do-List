<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="assets/JavaScript/update-script.js"></script>
    <title>Update To-Do Task</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-warning mt-5">Update Task</h1>
            <div class="mb-3">
                <label for="taskId" class="form-label">Task ID</label>
                <input type="text" class="form-control" id="taskId" placeholder="Enter task ID to update" />
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter new name of the task" />
            </div>
            <div class="mb-3 d-flex flex-column">
                <label for="status" class="form-label">Status:</label>
                <select class="form-select" id="status" name="task-status">
                    <option>Completed</option>
                    <option>Pending</option>
                </select>
            </div>
            <div>
                <a href="index.html"><button class="btn btn-outline-success">Go back</button></a>
                <button class="btn btn-warning" id="updateBtn">Update Task</button>
            </div>
            <div id="toast" class="alert d-none mt-2" role="alert"></div>
        </div>
    </div>
</body>
</html>
