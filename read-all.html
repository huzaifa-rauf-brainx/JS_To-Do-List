<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read All To-Do Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="assets/JavaScript/read-all.js" defer></script>
    <link rel="icon" href="assets/Images/favicon.png" type="image/png" />
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center text-success mb-4">All Tasks</h1>
        <div class="mb-4 d-flex gap-3 justify-content-center">
            <select class="form-select w-auto" id="statusFilter" aria-label="Filter by status">
                <option value="all">All</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>
        </div>
        <div class="d-flex justify-content-center my-4" id="loader">
            <div class="spinner-border text-success" role="status" aria-label="Loading tasks...">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="todoList" class="row gy-3"></div>
        <nav class="d-flex justify-content-center my-4">
            <ul class="pagination" id="pagination"></ul>
        </nav>
        <div class="text-center">
            <a href="index.html" class="btn btn-lg btn-outline-success mb-4">Go back</a>
        </div>
    </div>
</body>
</html>
