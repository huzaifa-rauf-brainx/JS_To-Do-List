<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/JavaScript/add-script.js"></script>
    <title>Add to To-Do List</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-primary mt-5">Add a task</h1>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter name of the task">
            </div>
            <div class="mb-3 d-flex flex-column">
                <label for="description" class="form-label">Description</label>
                 <textarea name="description" id="description" placeholder="Enter description of the task"></textarea>
            </div>
            <div>
                <a href="index.html"><button class="btn btn-outline-success">Go back</button></a>
                <button class="btn btn-primary" id="addBtn">Add Task</button>
            </div>
            <div id="toast" class="alert d-none mt-2" role="alert"></div>
        </div>
    </div>
</body>
</html>
