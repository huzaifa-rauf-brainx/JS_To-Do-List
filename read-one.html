<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Single Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="assets/JavaScript/read-one.js" defer></script>
    <link rel="icon" href="assets/Images/favicon.png" type="image/png" />
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-info mt-5">Read a Task</h1>
            <form id="readTaskForm" novalidate aria-labelledby="readTaskLabel">
                <div class="mb-3">
                    <label for="taskId" class="form-label" id="readTaskLabel">Task ID</label>
                    <input type="number" class="form-control" id="taskId" name="taskId"
                        placeholder="Enter task ID to fetch" required min="1" aria-required="true" />
                </div>
                <div class="d-flex gap-2">
                    <a href="index.html" class="btn btn-outline-success">Go back</a>
                    <button type="submit" class="btn btn-info" id="readBtn">Read Task</button>
                </div>
            </form>
            <div id="toast" class="alert d-none mt-2" role="alert" aria-live="polite"></div>
            <div class="card mt-4 d-none" id="taskCard" aria-hidden="true">
                <div class="card-body">
                    <p class="card-text"><strong>User ID:</strong> <span id="taskUserId"></span></p>
                    <p class="card-text"><strong>Title:</strong> <span id="taskTitle"></span></p>
                    <p class="card-text"><strong>Status:</strong> <span id="taskCompleted"></span></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
