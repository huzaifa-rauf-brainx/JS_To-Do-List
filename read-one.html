<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="assets/JavaScript/read-one.js"></script>
    <title>Read Single Task</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-info mt-5">Read a Task</h1>
            <div class="mb-3">
                <label for="taskId" class="form-label">Task ID</label>
                <input type="text" class="form-control" id="taskId" placeholder="Enter task ID to fetch" />
            </div>
            <div>
                <a href="index.html"><button class="btn btn-outline-success">Go back</button></a>
                <button class="btn btn-info" id="readBtn">Read Task</button>
            </div>
            <div id="toast" class="alert d-none mt-2" role="alert"></div>
            <div class="card mt-4 d-none" id="taskCard">
                <div class="card-body">
                    <p class="card-text"><strong>User ID:</strong> <span id="taskUserId"></span></p>
                    <p class="card-text"><strong>Title:</strong> <span id="taskTitle"></span></p>
                    <p class="card-text"><strong>Status:</strong> <span id="taskCompleted"></span></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
