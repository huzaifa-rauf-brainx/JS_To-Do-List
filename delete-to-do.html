<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/JavaScript/delete-script.js"></script>
    <title>Delete from To-Do List</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="col-12 col-md-6 d-flex flex-column">
            <h1 class="text-center text-danger mt-5">Delete a task</h1>
            <div class="mb-3">
                <label for="taskID" class="form-label">Enter ID of the task to delete</label>
                <input type="number" class="form-control" id="taskID">
            </div>
            <div>
                <a href="index.html"><button class="btn btn-outline-success">Go back</button></a>
                <button class="btn btn-danger" id="deleteBtn">Delete Task</button>
            </div>
            <div id="toast" class="alert d-none mt-2" role="alert"></div>
        </div>
    </div>
</body>
</html>
